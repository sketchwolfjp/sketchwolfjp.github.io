<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketch Wolf">
<meta name="theme-color" content="#262624">
<title>Sketch Wolf — 会話と絵で暴け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Noto+Serif+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  .noto-serif-jp-uniquifier {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-style: normal;
  }
  :root{
    --bg:#f5f4ee;
    --panel:#fbfaf7;
    --panel2:#f0eee6;
    --ink:#3d3929;
    --ink-dim:#8a8371;
    --line:#e3ddd0;
    --amber:#d97757;
    --amber-dim:#f0ddd2;
    --red:#c1443c;
    --green:#4d8c68;
    --shadow: 0 12px 30px rgba(61,57,41,0.12);
    --canvas-bg:#f2efe9;
    --pen:#3d3929;
    --btn-primary-text:#fbfaf7;
    --grad1: rgba(217,119,87,0.06);
    --grad2: rgba(193,68,60,0.05);
    --vote-select-bg: rgba(217,119,87,0.10);
    --win-bg: rgba(77,140,104,0.12);
    color-scheme: light;
    --overlay-text:#f2efe9;
    --overlay-text-dim:#a7abc4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  @supports (height:100dvh){
    html,body{height:100dvh;}
  }
  html{ touch-action:manipulation; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, var(--grad1), transparent 40%),
      radial-gradient(circle at 85% 90%, var(--grad2), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:max(24px, env(safe-area-inset-top));
    padding-bottom:max(24px, env(safe-area-inset-bottom));
    padding-left:max(24px, env(safe-area-inset-left));
    padding-right:max(24px, env(safe-area-inset-right));
    overscroll-behavior:none;
  }
  #app{
    width:100%;
    max-width:640px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  @media (max-width:420px){
    body{ padding:14px; padding-top:max(14px, env(safe-area-inset-top)); padding-bottom:max(14px, env(safe-area-inset-bottom)); }
    .card{ padding:20px 16px; border-radius:16px; }
    h1{ font-size:1.7rem; }
    h2{ font-size:1.2rem; }
    .pass-screen .name{ font-size:2rem; }
    .reveal-box .word{ font-size:1.9rem; }
    .big-timer{ font-size:3.8rem; }
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:4px;
    background:linear-gradient(90deg, var(--amber), transparent 70%);
  }
  h1{
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-weight:900;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  h1 span{color:var(--amber);}
  .sub{color:var(--ink-dim); font-size:0.9rem; margin-bottom:20px;}
  .eyebrow{
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-weight:600;
    color:var(--amber);
    font-size:1rem;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  h2{
    font-size:1.4rem;
    margin:0 0 18px;
    font-weight:700;
  }
  label{
    display:block;
    font-size:0.85rem;
    color:var(--ink-dim);
    margin:14px 0 6px;
  }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:11px 12px;
    font-size:1rem;
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .players-list{margin-top:8px;}
  .player-row{
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .player-row input{flex:1;}
  .icon-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    width:44px; height:44px;
    cursor:pointer;
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn:hover{color:var(--red); border-color:var(--red);}
  button.primary{
    width:100%;
    margin-top:22px;
    background:var(--amber);
    color:var(--btn-primary-text);
    border:none;
    border-radius:12px;
    padding:16px;
    min-height:52px;
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    transition:transform .12s ease, filter .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button.primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
  button.primary:active{ transform:scale(0.98); }
  button.primary:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  button.ghost{
    width:100%;
    margin-top:10px;
    background:transparent;
    color:var(--ink-dim);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px;
    min-height:48px;
    font-size:0.95rem;
    cursor:pointer;
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  button.ghost:hover{color:var(--ink); border-color:var(--ink-dim);}
  button.ghost:active{ transform:scale(0.98); }
  button.add{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--ink-dim);
    border-radius:10px;
    padding:9px;
    width:100%;
    cursor:pointer;
    font-family:inherit;
  }
  .center{text-align:center;}
  .circle-timer{
    position:relative;
    width:180px; height:180px;
    margin:14px auto;
  }
  .circle-timer svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .circle-timer .ctrack{ fill:none; stroke:var(--panel2); stroke-width:10; }
  .circle-timer .cprogress{
    fill:none; stroke:var(--amber); stroke-width:10; stroke-linecap:round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
  }
  .circle-timer .ctext{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif; font-weight:700; font-size:2.6rem; color:var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .circle-timer.urgent .cprogress{ stroke:var(--red); }
  .circle-timer.urgent .ctext{ color:var(--red); }
  @keyframes pulseTimer{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }
  .circle-timer.urgent{ animation:pulseTimer 0.6s ease-in-out infinite; }
  .circle-timer.compact{ width:88px; height:88px; margin:6px auto; }
  .circle-timer.compact .ctext{ font-size:1.3rem; }
  .circle-timer.compact .ctrack, .circle-timer.compact .cprogress{ stroke-width:14; }
  .big-timer{
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-weight:700;
    font-size:5rem;
    color:var(--amber);
    line-height:1;
    margin:10px 0;
    font-variant-numeric: tabular-nums;
  }
  .timer-bar-track{
    height:8px; background:var(--panel2); border-radius:99px; overflow:hidden;
    border:1px solid var(--line);
  }
  .timer-bar-fill{
    height:100%; background:linear-gradient(90deg, var(--amber), var(--red));
    width:100%; transition:width 1s linear;
  }
  .pass-screen{
    text-align:center;
    padding:20px 0;
  }
  .pass-screen .name{
    font-family:'Yomogi', 'Hiragino Sans', sans-serif, cursive;
    font-size:2.4rem;
    color:var(--amber);
    margin:14px 0;
  }
  .reveal-box{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 18px;
    margin:18px 0;
    min-height:110px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .reveal-box .word{
    font-family:'Yomogi', 'Hiragino Sans', sans-serif, cursive;
    font-size:2.2rem;
    color:var(--ink);
  }
  .reveal-box .hint{color:var(--ink-dim); font-size:0.85rem; margin-top:6px;}
  .badge{
    display:inline-block;
    background:var(--amber-dim);
    color:var(--amber);
    font-size:0.75rem;
    padding:3px 10px;
    border-radius:99px;
    margin-bottom:8px;
    letter-spacing:0.05em;
  }
  canvas{
    display:block;
    background:var(--canvas-bg);
    border-radius:12px;
    width:100%;
    max-height:60vh;
    max-height:60dvh;
    touch-action:none;
    cursor:none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .tools{
    display:flex; gap:10px; align-items:center; margin:12px 0;
    flex-wrap:wrap;
  }
  .color-picker-wrap{display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:.82rem;}
  .color-picker-wrap input[type=color]{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;}
  .brush-cursor{position:fixed;left:0;top:0;width:16px;height:16px;display:none;pointer-events:none;z-index:1000;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(61,57,41,.65),0 1px 4px rgba(0,0,0,.35);}

  .swatch{
    width:36px; height:36px; border-radius:50%;
    border:2px solid transparent; cursor:pointer; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .swatch.active{border-color:var(--amber); transform:scale(1.15);}
  .tool-btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim);
    border-radius:8px; padding:10px 14px; min-height:40px; font-size:0.85rem; cursor:pointer;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .tool-btn.active{ color:var(--amber); border-color:var(--amber);}
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(130px,1fr));
    gap:12px;
    margin:16px 0;
  }
  .gallery-item{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:8px; text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .gallery-item img{width:100%; border-radius:8px; background:var(--canvas-bg);}
  .gallery-item .pname{
    margin-top:6px; font-size:0.85rem; color:var(--ink-dim);
  }
  .vote-list{margin:16px 0;}
  .vote-option{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:8px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .vote-option:hover{border-color:var(--amber);}
  .vote-option.selected{border-color:var(--amber); background:var(--vote-select-bg);}
  .vote-option .vname{font-weight:700;}
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .result-row:last-child{border-bottom:none;}
  .tag-wolf{color:var(--red); font-weight:700;}
  .tag-citizen{color:var(--ink-dim);}
  .outcome{
    text-align:center; padding:16px; border-radius:14px; margin:16px 0;
  }
  .outcome.win{background:var(--win-bg); border:1px solid var(--green);}
  .outcome.lose{background:rgba(193,68,60,0.15); border:1px solid var(--red);}
  .outcome h2{margin-bottom:4px;}
  .phase-strip{
    display:flex; gap:4px; margin-bottom:18px;
  }
  .phase-strip .seg{
    flex:1; height:4px; border-radius:99px; background:var(--line);
  }
  .phase-strip .seg.done{background:var(--amber);}
  .phase-strip .seg.now{background:var(--ink);}
  small.foot{display:block; text-align:center; color:var(--ink-dim); margin-top:14px; font-size:0.75rem;}
  .word-hidden{
    filter:blur(0px);
  }
  .tap-hint{
    color:var(--ink-dim); font-size:0.85rem; margin-top:4px;
  }
  /* ---------- プレイヤー固定色のバッジ ---------- */
  .player-color-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 12px 5px 6px;
    border-radius:99px;
    font-size:0.85rem;
    background:var(--panel2);
    border:1px solid var(--line);
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }
  .player-color-badge.strong{
    background:var(--panel);
    border:1px solid var(--ink-dim);
    font-size:0.95rem;
    padding:6px 14px 6px 6px;
  }
  .pdot{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:22px;
    padding:0 7px;
    border-radius:99px;
    color:#fff;
    font-size:0.75rem;
    font-weight:700;
    letter-spacing:0;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6) inset;
  }
  .player-color-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:0.85rem;
    color:var(--ink-dim);
    margin:4px 0 10px;
  }
  .pname .pdot, .vname .pdot, .result-name .pdot{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:22px;
    padding:0 7px;
    border-radius:99px;
    color:#fff;
    font-size:0.72rem;
    font-weight:700;
    margin-right:6px;
    vertical-align:middle;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6) inset;
  }
  .vname{ display:inline-flex; align-items:center; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
window.addEventListener("error", (e)=>{
  console.error("Sketch Wolf uncaught error:", e.error || e.message);
  try {
    const appEl = document.getElementById("app");
    if(appEl && typeof renderCrash === "function"){
      renderCrash(e.error || new Error(String(e.message)));
    }
  } catch(_){}
});
window.addEventListener("unhandledrejection", (e)=>{
  console.error("Sketch Wolf unhandled rejection:", e.reason);
  try {
    const appEl = document.getElementById("app");
    if(appEl && typeof renderCrash === "function"){
      renderCrash(e.reason instanceof Error ? e.reason : new Error(String(e.reason)));
    }
  } catch(_){}
});

/* ---------- お題ペア ---------- */
const TOPIC_PAIRS = [
  ["ネコ","ライオン"],["犬","オオカミ"],["海","プール"],["温泉","銭湯"],
  ["映画館","劇場"],["コンビニ","スーパー"],["山","丘"],["台風","地震"],
  ["図書館","本屋"],["消防士","警察官"],
  ["マウス","ハムスター"],["コーヒー","ココア"],["ピザ","お好み焼き"],
  ["カラス","ペンギン"],["リュック","スーツケース"],["ボールペン","シャープペン"],
  ["UFO","ロケット"],["ラーメン","そば"],["カレー","シチュー"],["新幹線","飛行機"],
  ["食パン","フランスパン"],["ノート","手帳"],["扇風機","エアコン"],
  ["軍手","手袋"],["ソファ","ベンチ"],["水筒","マグカップ"],
  ["ホチキス","クリップ"],["傘","日傘"],["リモコン","スイッチ"],["財布","カードケース"]
];

/* ---------- 状態 ---------- */
const PLAYER_NAMES_KEY = "sketchwolf-players";
function defaultPlayerNames(count=3){ return Array.from({length:count}, (_,i)=>`Player${i+1}`); }
function loadSavedNames(){
  try {
    const raw = localStorage.getItem(PLAYER_NAMES_KEY);
    const arr = raw ? JSON.parse(raw) : null;
    if(Array.isArray(arr) && arr.length >= 3){ return arr.slice(0,8).map((v,i)=>String(v||`Player${i+1}`)); }
  } catch(e){}
  return defaultPlayerNames();
}
function saveNames(names){
  try { localStorage.setItem(PLAYER_NAMES_KEY, JSON.stringify(names.map((v,i)=>String(v||`Player${i+1}`).trim()||`Player${i+1}`))); } catch(e){}
}

let state = {
  screen: "setup",
  players: loadSavedNames(),
  wolfCount: 1,
  topic: null,       // {citizen, wolf}
  roles: [],          // per player: "citizen" | "wolf"
  order: [],           // shuffled index order for pass phases
  passIndex: 0,
  drawings: [],        // image URLs per player index
  votes: {},           // playerIndex(voter) -> playerIndex(target)
  voteIndex: 0,
  timer: null,
  timerRemaining: 0,
  timerTotal: 0,
  timerEndAt: null,
  timerOnEnd: null,
  hintTime: 10,
  drawSeconds: 45,
  talkSeconds: 30,
  playerColors: [],    // index -> hex color (fixed per player number)
};

const app = document.getElementById("app");

function revokeDrawingUrl(url){
  if(typeof url === "string" && url.startsWith("blob:")){
    try { URL.revokeObjectURL(url); } catch(e){}
  }
}
function clearDrawingCache(){
  if(Array.isArray(state.drawings)){
    state.drawings.forEach(revokeDrawingUrl);
  }
  state.drawings = [];
}

function render(){
  try {
    clearTimerInterval();
    if(state.screen === "setup") return renderSetup();
    if(state.screen === "intro") return renderIntro();
    if(state.screen === "pass-topic") return renderPassTopic();
    if(state.screen === "talk") return renderTalk();
    if(state.screen === "pass-draw") return renderPassDraw();
    if(state.screen === "gallery") return renderGallery();
    if(state.screen === "vote") return renderVote();
    if(state.screen === "result") return renderResult();
  } catch(err){
    renderCrash(err);
  }
}

function renderCrash(err){
  clearTimerInterval();
  console.error("Sketch Wolf render error:", err);
  app.innerHTML = `
    <div class="card">
      <div class="badge" style="background:var(--red); color:#fff;">エラーが発生しました</div>
      <h2 style="font-size:1.1rem;">画面の表示中に問題が起きました</h2>
      <p style="color:var(--ink-dim); font-size:0.85rem; line-height:1.6;">
        お手数ですが「最初からやり直す」を押してください。繰り返し発生する場合は、下のエラー内容を開発者に共有してください。
      </p>
      <pre style="background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:0.75rem; color:var(--ink-dim); white-space:pre-wrap; overflow-x:auto; max-height:160px;">${escapeHtml((err && err.stack) || String(err))}</pre>
      <button class="primary" id="crash-restart">最初からやり直す</button>
    </div>
  `;
  const btn = document.getElementById("crash-restart");
  if(btn){
    btn.addEventListener("click", ()=>{
      clearDrawingCache();
      state.screen = "setup";
      render();
    });
  }
}

function card(inner){
  app.innerHTML = `<div class="card">${inner}</div>`;
}

/* ---------- セットアップ ---------- */
function renderSetup(){
  const playersHtml = state.players.map((p,i)=>`
    <div class="player-row">
      <input type="text" placeholder="Player${i+1}" value="${escapeHtml(p || `Player${i+1}`)}" data-idx="${i}" class="pname-input" maxlength="10">
      ${state.players.length>3 ? `<button class="icon-btn" data-remove="${i}">✕</button>` : ""}
    </div>
  `).join("");

  card(`
    <div class="eyebrow">会話 × 絵 で推理するワードウルフ</div>
    <h1>Sketch<span> Wolf</span></h1>
    <div class="sub">同じ画面をパスして遊ぶ、1台端末プレイ版</div>
    <h2>プレイヤー設定</h2>
    <div class="players-list" id="players-list">${playersHtml}</div>
    <button class="add" id="add-player">＋ プレイヤーを追加</button>

    <button class="primary" id="start-btn">ゲームを始める</button>
    <small class="foot">人数は3〜8人。ウルフは1人固定です。端末を順番に回して遊びます。</small>
  `);

  document.querySelectorAll(".pname-input").forEach(inp=>{
    inp.addEventListener("focus", e=>{
      setTimeout(()=>{
        e.target.scrollIntoView({block:"center", behavior:"smooth"});
      }, 300);
    });
    inp.addEventListener("input", e=>{
      state.players[+e.target.dataset.idx] = e.target.value;
      saveNames(state.players);
    });
    inp.addEventListener("blur", e=>{
      const idx = +e.target.dataset.idx;
      const trimmed = e.target.value.trim() || `Player${idx+1}`;
      e.target.value = trimmed;
      state.players[idx] = trimmed;
      saveNames(state.players);
    });
  });
  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      state.players.splice(+e.target.dataset.remove,1);
      render();
    });
  });
  document.getElementById("add-player").addEventListener("click", ()=>{
    if(state.players.length>=8) return;
    state.players.push("");
    render();
  });
  document.getElementById("start-btn").addEventListener("click", ()=>{
    const names = state.players.map((p,i)=>p.trim() || `Player${i+1}`);
    const filled = names;
    if(filled.length < 3){ alert("3人以上の名前を入力してください(2人には対応していません)"); return; }
    if(filled.length > 8){ alert("プレイヤーは最大8人までです"); return; }
    if(new Set(filled.map(normalizeName)).size !== filled.length){ alert("名前が重複しています"); return; }
    state.players = filled;
    saveNames(filled);
    state.wolfCount = 1;
    setupGame();
  });
}

function setupGame(){
  clearDrawingCache();
  const pair = TOPIC_PAIRS[Math.floor(Math.random()*TOPIC_PAIRS.length)];
  state.topic = { citizen: pair[0], wolf: pair[1] };
  state.hintTime = Math.max(8, Math.round(60/state.players.length));
  state.drawSeconds = 45;
  state.talkSeconds = 30;
  const n = state.players.length;
  // プレイヤー番号 → 固定色を再ゲームでも番号基準で安定的に割り当てる。
  // 名前は localStorage に保存されており、プレイヤーの並び/順番は可変だが
  // 「番号（1〜N）= 色」の対応は 1 から変わらない（端末を誰がパスしても変わらない）。
  state.playerColors = Array.from({length: n}, (_, i)=> playerColor(i));
  const idxs = [...Array(n).keys()];
  shuffle(idxs);
  const wolves = new Set(idxs.slice(0, state.wolfCount));
  state.roles = state.players.map((_,i)=> wolves.has(i) ? "wolf" : "citizen");
  state.order = [...Array(n).keys()];
  state.passIndex = 0;
  state.drawings = new Array(n).fill(null);
  state.votes = {};
  state.voteIndex = 0;
  state.screen = "intro";
  render();
}

function phaseSegs(current){
  const phases = ["topic","talk","draw","gallery","vote","result"];
  return phases.map(p=>{
    const idx = phases.indexOf(p), curIdx = phases.indexOf(current);
    let cls = "seg";
    if(idx < curIdx) cls += " done";
    if(idx === curIdx) cls += " now";
    return `<div class="${cls}"></div>`;
  }).join("");
}

/* ---------- お絵描き（パス&プレイ） ---------- */
let canvasCtx = null;
let drawing = false;
let lastX=0,lastY=0;
let currentColor = "#3d3929";
let currentSize = 5;
const PEN_COLORS = ["#3d3929","#c1443c","#d97757","#3b6ea5","#4d8c68"];

/* ---------- プレイヤー固定色（番号→色／色名） ----------
 * 公開画面（ギャラリー）と投票画面、投票結果で同じ色を表示し、誰の絵かを一目で識別できるようにする。
 * 端末をパスして遊んでも番号→色の対応は不変。
 */
const PLAYER_COLORS = [
  "#c1443c", // P1: 赤
  "#3b6ea5", // P2: 青
  "#c79100", // P3: 琥珀（＝視認性を高めた濃いめの黄）
  "#3d7556", // P4: 深緑（赤と明度を離して色覚多様性に配慮）
  "#7b5ea7", // P5: 紫
  "#8b5a3c", // P6: 茶
  "#c2538a", // P7: 桃
  "#2a8d8a"  // P8: ターコイズ
];
const PLAYER_COLOR_NAMES = ["赤","青","琥珀","深緑","紫","茶","桃","ターコイズ"];
function playerColor(idx){
  return PLAYER_COLORS[idx % PLAYER_COLORS.length];
}
function playerColorName(idx){
  return PLAYER_COLOR_NAMES[idx % PLAYER_COLOR_NAMES.length];
}
function colorBadge(idx, strong){
  const c = playerColor(idx);
  return `<span class="player-color-badge${strong?' strong':''}" aria-label="プレイヤー${idx+1}の色">
    <span class="pdot" style="background:${c}">${idx+1}</span>
    <span>プレイヤー${idx+1}・${playerColorName(idx)}</span>
  </span>`;
}

function renderPassDraw(){
  const i = state.order[state.passIndex];
  const name = state.players[i];
  const started = state.drawStarted;
  if(!started) currentSize = 5;

  if(!started){
    card(`
      <div class="phase-strip">${phaseSegs("draw")}</div>
      <div class="eyebrow">お絵描きタイム ${state.passIndex+1} / ${state.players.length}</div>
      <div class="pass-screen">
        <div>端末をこの人に渡してください</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="player-color-row">${colorBadge(i, true)}</div>
        <button class="primary" id="start-draw" disabled>描き始める</button>
      </div>
    `);
    const startDrawBtn = document.getElementById("start-draw");
    setTimeout(()=>{ if(startDrawBtn) startDrawBtn.disabled = false; }, 500);
    startDrawBtn.addEventListener("click", ()=>{
      state.drawStarted = true;
      render();
    });
    return;
  }

  // 描き始めに、そのプレイヤー固有の色を初期ペン色にセットする
  currentColor = playerColor(i);

  card(`
    <div class="phase-strip">${phaseSegs("draw")}</div>
    <div class="eyebrow">${escapeHtml(name)} が描いています</div>
    <div class="center" style="margin-bottom:6px;">
      <div class="player-color-row" style="margin-bottom:8px;">${colorBadge(i, true)}</div>
      ${circleTimerHtml(state.drawSeconds, true)}
    </div>
    <canvas id="canvas" width="500" height="360"></canvas>
    <div class="brush-cursor" id="brush-cursor" aria-hidden="true"></div>
    <div class="tools">
      ${PEN_COLORS.map(c=>`<div class="swatch ${c===currentColor?'active':''}" style="background:${c}" data-color="${c}"></div>`).join("")}
      <label class="color-picker-wrap" title="色を選ぶ"><span>色</span><input type="color" id="color-picker" value="${currentColor}"></label>
      <button class="tool-btn" id="clear-canvas">全部消す</button>
    </div>
    <div class="tap-hint" id="pen-size-hint">太さ変更: PCは右クリック押しながら左右にドラッグ / スマホは素早く2回タップ後そのまま左右にドラッグ</div>
    <button class="primary" id="done-draw">描き終わった</button>
  `);

  const canvas = document.getElementById("canvas");
  canvasCtx = canvas.getContext("2d");
  const bgColor = getComputedStyle(document.documentElement).getPropertyValue("--canvas-bg").trim() || "#f2efe9";
  canvasCtx.fillStyle = bgColor;
  canvasCtx.fillRect(0,0,canvas.width,canvas.height);
  canvasCtx.lineJoin = "round";
  canvasCtx.lineCap = "round";
  if("imageSmoothingEnabled" in canvasCtx) canvasCtx.imageSmoothingEnabled = true;
  canvas.addEventListener("contextmenu", e=> e.preventDefault());

  const MIN_SIZE = 2, MAX_SIZE = 24;
  let resizingPen = false;
  let resizeStartX = 0;
  let resizeStartSize = currentSize;
  let lastTouchEnd = { time:0, x:0, y:0 };

  let points = [];
  const brushCursor = document.getElementById("brush-cursor");
  function updateBrushCursor(x,y,visible=true){
    if(!brushCursor) return;
    const diameter = Math.max(12, currentSize*2);
    brushCursor.style.width = `${diameter}px`; brushCursor.style.height = `${diameter}px`;
    brushCursor.style.left = `${x}px`; brushCursor.style.top = `${y}px`;
    brushCursor.style.display = visible ? "block" : "none";
  }
  function hideBrushCursor(){ if(brushCursor) brushCursor.style.display="none"; }

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width/rect.width, scaleY = canvas.height/rect.height;
    const cx = (e.touches? e.touches[0].clientX : e.clientX);
    const cy = (e.touches? e.touches[0].clientY : e.clientY);
    return [(cx-rect.left)*scaleX, (cy-rect.top)*scaleY];
  }
  function clientX(e){
    return e.touches ? e.touches[0].clientX : e.clientX;
  }
  function startResize(clientXPos){
    resizingPen = true;
    resizeStartX = clientXPos;
    resizeStartSize = currentSize;
  }
  function updateResize(clientXPos){
    const delta = clientXPos - resizeStartX;
    currentSize = Math.round(Math.min(MAX_SIZE, Math.max(MIN_SIZE, resizeStartSize + delta/6)));
    updateBrushCursor(lastX,lastY,true);
  }
  function start(e){
    e.preventDefault();
    if(e.button === 2){
      startResize(clientX(e));
      return;
    }
    drawing=true;
    [lastX,lastY]=pos(e);
    updateBrushCursor(e.clientX,e.clientY,true);
    points=[[lastX,lastY]];
  }
  function move(e){
    if(resizingPen){
      e.preventDefault();
      updateResize(clientX(e));
      return;
    }
    if(!drawing) return;
    e.preventDefault();
    const [x,y]=pos(e);
    updateBrushCursor(e.clientX,e.clientY,true);
    points.push([x,y]);
    canvasCtx.strokeStyle = currentColor;
    canvasCtx.lineWidth = currentSize;
    if(points.length < 3){
      canvasCtx.beginPath();
      canvasCtx.moveTo(lastX,lastY);
      canvasCtx.lineTo(x,y);
      canvasCtx.stroke();
    } else {
      const n = points.length;
      const [x0,y0] = points[n-3];
      const [x1,y1] = points[n-2];
      const midPrev = [(x0+x1)/2, (y0+y1)/2];
      const midCurr = [(x1+x)/2, (y1+y)/2];
      canvasCtx.beginPath();
      canvasCtx.moveTo(midPrev[0], midPrev[1]);
      canvasCtx.quadraticCurveTo(x1, y1, midCurr[0], midCurr[1]);
      canvasCtx.stroke();
    }
    [lastX,lastY]=[x,y];
  }
  function end(){ drawing=false; points=[]; resizingPen=false; }

  function touchStart(e){
    const t = e.touches[0];
    const now = Date.now();
    const isDoubleTap = (now - lastTouchEnd.time < 300) &&
      Math.abs(t.clientX - lastTouchEnd.x) < 40 && Math.abs(t.clientY - lastTouchEnd.y) < 40;
    if(isDoubleTap){
      e.preventDefault();
      startResize(t.clientX);
      return;
    }
    start(e);
  }
  function touchEndHandler(e){
    if(resizingPen){
      end();
      lastTouchEnd = { time:0, x:0, y:0 };
      return;
    }
    const t = e.changedTouches[0];
    lastTouchEnd = { time: Date.now(), x: t.clientX, y: t.clientY };
    hideBrushCursor();
    end();
  }

  canvas.addEventListener("mousedown", start);
  canvas.addEventListener("mousemove", move);
  canvas.addEventListener("mouseenter", e=>updateBrushCursor(e.clientX,e.clientY,true));
  canvas.addEventListener("mouseup", end);
  canvas.addEventListener("mouseleave", ()=>{ end(); hideBrushCursor(); });
  canvas.addEventListener("touchstart", touchStart, {passive:false});
  canvas.addEventListener("touchmove", move, {passive:false});
  canvas.addEventListener("touchend", touchEndHandler);

  function refreshToolButtons(){
    document.querySelectorAll(".swatch").forEach(sw=>{
      sw.classList.toggle("active", sw.dataset.color === currentColor);
    });
  }

  document.querySelectorAll(".swatch").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      currentColor = sw.dataset.color;
      refreshToolButtons();
    });
  });
  document.getElementById("color-picker").addEventListener("input", e=>{
    currentColor = e.target.value;
    refreshToolButtons();
  });

  document.getElementById("clear-canvas").addEventListener("click", ()=>{
    canvasCtx.fillStyle = bgColor;
    canvasCtx.fillRect(0,0,canvas.width,canvas.height);
  });

  let finished = false;
  async function finishDrawing(){
    if(finished) return;
    finished = true;
    clearTimerInterval();

    const blob = await new Promise(resolve => {
      try {
        canvas.toBlob(resolve, "image/webp", 0.82);
      } catch(e){
        resolve(null);
      }
    });

    revokeDrawingUrl(state.drawings[i]);
    state.drawings[i] = blob
      ? URL.createObjectURL(blob)
      : canvas.toDataURL("image/png");

    state.drawStarted = false;
    state.passIndex++;
    if(state.passIndex >= state.players.length){
      state.passIndex = 0;
      state.screen = "gallery";
    }
    render();
  }

  document.getElementById("done-draw").addEventListener("click", ()=>{
    finishDrawing();
  });

  startTimer(state.drawSeconds, finishDrawing);
}

function showZoom(src, name, color){
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.75); display:flex; align-items:center; justify-content:center; z-index:999; padding:24px;";
  overlay.innerHTML = `
    <div style="max-width:420px; width:100%; text-align:center;">
      <img src="${src}" decoding="async" draggable="false" style="width:100%; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,0.5);">
      <div style="color:var(--overlay-text); font-family:'Yomogi','Hiragino Sans',sans-serif,cursive; font-size:1.4rem; margin-top:12px; display:inline-flex; align-items:center; gap:10px; justify-content:center;">
        <span class="pdot" style="background:${color}"> </span>${escapeHtml(name)}
      </div>
      <div style="color:var(--overlay-text-dim); font-size:0.85rem; margin-top:4px;">タップして閉じる</div>
    </div>
  `;
  overlay.addEventListener("click", ()=> overlay.remove());
  document.body.appendChild(overlay);
}

/* ---------- 投票（パス&プレイ） ---------- */
function renderVote(){

    if(i===voter) return "";
    return `<div class="vote-option ${selected===i?'selected':''}" data-target="${i}">
      <span class="vname"><span class="pdot" style="background:${playerColor(i)}">${i+1}</span>${escapeHtml(name)}</span>
      <span>${selected===i?"✓":""}</span>
    </div>`;
  }).join("");

  card(`
    <div class="phase-strip">${phaseSegs("vote")}</div>
    <div class="eyebrow">投票 ${voter+1} / ${state.players.length}</div>

      <div>端末をこの人に渡してください</div>
      <div class="name">${escapeHtml(voterName)}</div>

/* ---------- 結果 ---------- */
function renderResult(){
  const tally = new Array(state.players.length).fill(0);
  Object.values(state.votes).forEach(t=> tally[t]++);
  const maxVotes = Math.max(...tally);
  const topVoted = tally.map((v,i)=>v===maxVotes?i:-1).filter(i=>i>=0);

  const wolfIdxs = state.roles.map((r,i)=>r==="wolf"?i:-1).filter(i=>i>=0);
  const caughtAllWolves = wolfIdxs.length>0 && wolfIdxs.every(w=>topVoted.includes(w)) && topVoted.length===wolfIdxs.length;
  const citizensWin = caughtAllWolves;
  const isTie = topVoted.length > 1;

  let tieNote = "";
  if(isTie){
    const tieNames = topVoted.map(i=>state.players[i]).join("・");
    if(citizensWin){
      tieNote = `最多票が${tieNames}で同着でしたが、ウルフ全員がちょうどその中に含まれていたため市民の勝ちです。`;
    } else {
      tieNote = `最多票が${tieNames}で同着になり、ウルフを1人に絞りきれなかった(または市民を巻き込んだ)ためウルフの勝ちです。`;
    }
  }

  const maxTally = Math.max(1, ...tally);
  const rows = state.players.map((name,i)=>`
    <div class="result-row" style="flex-direction:column; align-items:stretch; gap:6px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="result-name" style="display:inline-flex; align-items:center;"><span class="pdot" style="background:${playerColor(i)}">${i+1}</span>${escapeHtml(name)} <span style="color:var(--ink-dim); font-size:0.85rem; margin-left:6px;">(${tally[i]}票)</span></span>
        <span class="${state.roles[i]==='wolf'?'tag-wolf':'tag-citizen'}">${state.roles[i]==='wolf'?'ウルフ':'市民'}</span>
      </div>
      <div class="timer-bar-track">
        <div class="vote-bar-fill" data-final="${(tally[i]/maxTally)*100}" style="height:100%; width:0%; border-radius:99px; background:${playerColor(i)}; transition:width 0.9s cubic-bezier(.2,.8,.3,1);"></div>
      </div>
    </div>
  `).join("");

  card(`
    <div class="phase-strip">${phaseSegs("result")}</div>
    <div class="eyebrow">結果発表</div>
    <div class="outcome ${citizensWin?'win':'lose'}">
      <h2>${citizensWin ? "市民の勝ち!" : "ウルフの勝ち!"}</h2>
      <div style="color:var(--ink-dim); font-size:0.9rem;">
        市民のお題「${escapeHtml(state.topic.citizen)}」 / ウルフのお題「${escapeHtml(state.topic.wolf)}」
      </div>
    </div>
    ${isTie ? `<div class="tap-hint" style="margin-bottom:14px;">${escapeHtml(tieNote)}</div>` : ""}
    <h2 style="font-size:1.05rem;">投票結果と正体</h2>
    <div>${rows}</div>
    <button class="primary" id="replay">同じメンバーでもう一度</button>
    <button class="ghost" id="restart">最初から設定し直す</button>
  `);

  document.getElementById("replay").addEventListener("click", ()=>{
    setupGame();
  });
  document.getElementById("restart").addEventListener("click", ()=>{
    clearDrawingCache();
    state.screen = "setup";
    state.votes = {};
    render();
  });

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      document.querySelectorAll(".vote-bar-fill").forEach(el=>{
        el.style.width = el.dataset.final + "%";
      });
    }, 80);
  });
}

/* ---------- タイマー共通 ---------- */
const TIMER_R = 80;
const TIMER_CIRC = 2 * Math.PI * TIMER_R;
function circleTimerHtml(seconds, compact){
  return `
    <div class="circle-timer${compact?' compact':''}" id="circle-timer">
      <svg viewBox="0 0 180 180">
        <circle class="ctrack" cx="90" cy="90" r="${TIMER_R}"></circle>
        <circle class="cprogress" id="timer-circle" cx="90" cy="90" r="${TIMER_R}"
          stroke-dasharray="${TIMER_CIRC}" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ctext" id="timer-display" aria-live="polite">00:${String(seconds).padStart(2,"0")}</div>
    </div>
  `;
}
let wakeLock = null;
async function requestWakeLock(){
  try {
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e){ /* wake lock not available, ignore */ }
}
function releaseWakeLock(){
  if(wakeLock){
    try { wakeLock.release(); } catch(e){}
    wakeLock = null;
  }
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && state.timer && !wakeLock){
    requestWakeLock();
  }
});

function startTimer(seconds, onEnd){
  clearTimerInterval();
  requestWakeLock();
  state.timerTotal = seconds;
  state.timerEndAt = Date.now() + seconds*1000;
  state.timerRemaining = seconds;
  state.timerOnEnd = onEnd;
  updateTimerDisplay();
  state.timer = setInterval(tick, 250);
  function tick(){
    const remainingMs = state.timerEndAt - Date.now();
    state.timerRemaining = Math.max(0, Math.ceil(remainingMs/1000));
    if(remainingMs <= 0){
      clearTimerInterval();
      state.timerRemaining = 0;
      updateTimerDisplay();
      const cb = state.timerOnEnd;
      state.timerOnEnd = null;
      if(cb) cb();
      return;
    }
    updateTimerDisplay();
  }
}
function updateTimerDisplay(){
  const el = document.getElementById("timer-display");
  const bar = document.getElementById("timer-bar");
  const circle = document.getElementById("timer-circle");
  const wrap = document.getElementById("circle-timer");
  if(el){
    const m = Math.floor(state.timerRemaining/60).toString().padStart(2,"0");
    const s = (state.timerRemaining%60).toString().padStart(2,"0");
    el.textContent = `${m}:${s}`;
  }
  if(bar){
    bar.style.width = `${(state.timerRemaining/state.timerTotal)*100}%`;
  }
  if(circle){
    const ratio = Math.max(0, state.timerRemaining/state.timerTotal);
    circle.style.strokeDashoffset = `${TIMER_CIRC * (1-ratio)}`;
  }
  if(wrap){
    if(state.timerRemaining <= 5 && state.timerRemaining > 0){
      wrap.classList.add("urgent");
    } else {
      wrap.classList.remove("urgent");
    }
  }
}
function clearTimerInterval(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  releaseWakeLock();
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && state.timer && state.timerEndAt){
    const remainingMs = state.timerEndAt - Date.now();
    state.timerRemaining = Math.max(0, Math.ceil(remainingMs/1000));
    if(remainingMs <= 0){
      clearTimerInterval();
      state.timerRemaining = 0;
      updateTimerDisplay();
      const cb = state.timerOnEnd;
      state.timerOnEnd = null;
      if(cb) cb();
    } else {
      updateTimerDisplay();
    }
  }
});

/* ---------- ユーティリティ ---------- */
function filledCount(players){
  return players.map(p=>p.trim()).filter(n=>n.length>0).length;
}
function normalizeName(n){
  return n.trim().normalize("NFKC").toLowerCase();
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

render();
