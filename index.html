<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sketch Wolf">
<meta name="theme-color" content="#262624">
<title>Sketch Wolf — 会話と絵で暴け</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Noto+Serif+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  .noto-serif-jp-uniquifier {
    font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-style: normal;
  }
  :root{
    --bg:#f5f4ee;
    --panel:#fbfaf7;
    --panel2:#f0eee6;
    --ink:#3d3929;
    --ink-dim:#8a8371;
    --line:#e3ddd0;
    --amber:#d97757;
    --amber-dim:#f0ddd2;
    --red:#c1443c;
    --green:#4d8c68;
    --shadow: 0 12px 30px rgba(61,57,41,0.12);
    --canvas-bg:#f2efe9;
    --pen:#3d3929;
    --btn-primary-text:#fbfaf7;
    --grad1: rgba(217,119,87,0.06);
    --grad2: rgba(193,68,60,0.05);
    --vote-select-bg: rgba(217,119,87,0.10);
    --win-bg: rgba(77,140,104,0.12);
    color-scheme: light;
    --overlay-text:#f2efe9;
    --overlay-text-dim:#a7abc4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overscroll-behavior:none;}
  @supports (height:100dvh){
    html,body{height:100dvh;}
  }
  html{ touch-action:manipulation; }
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(circle at 15% 10%, var(--grad1), transparent 40%),
      radial-gradient(circle at 85% 90%, var(--grad2), transparent 45%),
      var(--bg);
    color:var(--ink);
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:max(24px, env(safe-area-inset-top));
    padding-bottom:max(24px, env(safe-area-inset-bottom));
    padding-left:max(24px, env(safe-area-inset-left));
    padding-right:max(24px, env(safe-area-inset-right));
    overscroll-behavior:none;
  }
  #app{
    width:100%;
    max-width:640px;
  }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    padding:28px 24px;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  @media (max-width:420px){
    body{ padding:14px; padding-top:max(14px, env(safe-area-inset-top)); padding-bottom:max(14px, env(safe-area-inset-bottom)); }
    .card{ padding:20px 16px; border-radius:16px; }
    h1{ font-size:1.7rem; }
    h2{ font-size:1.2rem; }
    .pass-screen .name{ font-size:2rem; }
    .reveal-box .word{ font-size:1.9rem; }
    .big-timer{ font-size:3.8rem; }
  }
  .card::before{
    content:"";
    position:absolute;
    top:0;left:0;right:0;
    height:4px;
    background:linear-gradient(90deg, var(--amber), transparent 70%);
  }
  h1{
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-weight:900;
    font-size:2.1rem;
    margin:0 0 4px;
    letter-spacing:0.02em;
    color:var(--ink);
  }
  h1 span{color:var(--amber);}
  .sub{color:var(--ink-dim); font-size:0.9rem; margin-bottom:20px;}
  .eyebrow{
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-weight:600;
    color:var(--amber);
    font-size:1rem;
    letter-spacing:0.05em;
    margin-bottom:6px;
  }
  h2{
    font-size:1.4rem;
    margin:0 0 18px;
    font-weight:700;
  }
  label{
    display:block;
    font-size:0.85rem;
    color:var(--ink-dim);
    margin:14px 0 6px;
  }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:10px;
    padding:11px 12px;
    font-size:1rem;
    font-family:inherit;
  }
  input:focus{outline:2px solid var(--amber); outline-offset:1px;}
  .row{display:flex; gap:10px;}
  .row > *{flex:1;}
  .players-list{margin-top:8px;}
  .player-row{
    display:flex; align-items:center; gap:8px;
    margin-bottom:8px;
  }
  .player-row input{flex:1;}
  .icon-btn{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    width:44px; height:44px;
    cursor:pointer;
    font-size:1rem;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    -webkit-tap-highlight-color: transparent;
  }
  .icon-btn:active{ transform:scale(0.92); }
  .icon-btn:hover{color:var(--red); border-color:var(--red);}
  button.primary{
    width:100%;
    margin-top:22px;
    background:var(--amber);
    color:var(--btn-primary-text);
    border:none;
    border-radius:12px;
    padding:16px;
    min-height:52px;
    font-size:1.05rem;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    transition:transform .12s ease, filter .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button.primary:hover{filter:brightness(1.08); transform:translateY(-1px);}
  button.primary:active{ transform:scale(0.98); }
  button.primary:disabled{opacity:0.4; cursor:not-allowed; transform:none;}
  button.ghost{
    width:100%;
    margin-top:10px;
    background:transparent;
    color:var(--ink-dim);
    border:1px solid var(--line);
    border-radius:12px;
    padding:13px;
    min-height:48px;
    font-size:0.95rem;
    cursor:pointer;
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  button.ghost:hover{color:var(--ink); border-color:var(--ink-dim);}
  button.ghost:active{ transform:scale(0.98); }
  button.add{
    background:transparent;
    border:1px dashed var(--line);
    color:var(--ink-dim);
    border-radius:10px;
    padding:9px;
    width:100%;
    cursor:pointer;
    font-family:inherit;
  }
  .center{text-align:center;}
  .circle-timer{
    position:relative;
    width:180px; height:180px;
    margin:14px auto;
  }
  .circle-timer svg{ transform:rotate(-90deg); width:100%; height:100%; }
  .circle-timer .ctrack{ fill:none; stroke:var(--panel2); stroke-width:10; }
  .circle-timer .cprogress{
    fill:none; stroke:var(--amber); stroke-width:10; stroke-linecap:round;
    transition: stroke-dashoffset 1s linear, stroke 0.4s ease;
  }
  .circle-timer .ctext{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif; font-weight:700; font-size:2.6rem; color:var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .circle-timer.urgent .cprogress{ stroke:var(--red); }
  .circle-timer.urgent .ctext{ color:var(--red); }
  @keyframes pulseTimer{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.06); }
  }
  .circle-timer.urgent{ animation:pulseTimer 0.6s ease-in-out infinite; }
  .circle-timer.compact{ width:88px; height:88px; margin:6px auto; }
  .circle-timer.compact .ctext{ font-size:1.3rem; }
  .circle-timer.compact .ctrack, .circle-timer.compact .cprogress{ stroke-width:14; }
  .big-timer{
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    font-weight:700;
    font-size:5rem;
    color:var(--amber);
    line-height:1;
    margin:10px 0;
    font-variant-numeric: tabular-nums;
  }
  .timer-bar-track{
    height:8px; background:var(--panel2); border-radius:99px; overflow:hidden;
    border:1px solid var(--line);
  }
  .timer-bar-fill{
    height:100%; background:linear-gradient(90deg, var(--amber), var(--red));
    width:100%; transition:width 1s linear;
  }
  .pass-screen{
    text-align:center;
    padding:20px 0;
  }
  .pass-screen .name{
    font-family:'Yomogi', 'Hiragino Sans', sans-serif, cursive;
    font-size:2.4rem;
    color:var(--amber);
    margin:14px 0;
  }
  .reveal-box{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:14px;
    padding:30px 18px;
    margin:18px 0;
    min-height:110px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .reveal-box .word{
    font-family:'Yomogi', 'Hiragino Sans', sans-serif, cursive;
    font-size:2.2rem;
    color:var(--ink);
  }
  .reveal-box .hint{color:var(--ink-dim); font-size:0.85rem; margin-top:6px;}
  .badge{
    display:inline-block;
    background:var(--amber-dim);
    color:var(--amber);
    font-size:0.75rem;
    padding:3px 10px;
    border-radius:99px;
    margin-bottom:8px;
    letter-spacing:0.05em;
  }
  .canvas-wrap{
    position:relative;
    width:100%;
    aspect-ratio: 25 / 18;
    max-height:60vh;
    max-height:60dvh;
    border-radius:12px;
    overflow:hidden;
    touch-action:none;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
    background:var(--canvas-bg);
  }
  canvas{
    display:block;
    position:absolute;
    top:0; left:0;
    background:var(--canvas-bg);
    touch-action:none;
    cursor:none;
    transform-origin:0 0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  .zoom-controls{
    position:absolute;
    right:8px; bottom:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:5;
  }
  .zoom-btn{
    width:38px; height:38px;
    border-radius:10px;
    background:rgba(251,250,247,0.92);
    border:1px solid var(--line);
    color:var(--ink);
    font-size:1.1rem;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 2px 8px rgba(61,57,41,0.15);
    font-family:'Noto Serif JP', 'Hiragino Mincho ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding:0;
  }
  .zoom-btn:active{ transform:scale(0.92); }
  #zoom-reset{ font-size:0.72rem; font-weight:600; color:var(--ink-dim); }
  .tools{
    display:flex; gap:10px; align-items:center; margin:12px 0;
    flex-wrap:wrap;
  }
  .color-picker-wrap{display:flex;align-items:center;gap:6px;color:var(--ink-dim);font-size:.82rem;}
  .color-picker-wrap input[type=color]{width:38px;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);cursor:pointer;}
  .brush-cursor{position:fixed;left:0;top:0;width:16px;height:16px;display:none;pointer-events:none;z-index:1000;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(61,57,41,.65),0 1px 4px rgba(0,0,0,.35);}

  .swatch{
    width:36px; height:36px; border-radius:50%;
    border:2px solid transparent; cursor:pointer; flex-shrink:0;
    -webkit-tap-highlight-color:transparent;
  }
  .swatch.active{border-color:var(--amber); transform:scale(1.15);}
  .tool-btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--ink-dim);
    border-radius:8px; padding:10px 14px; min-height:40px; font-size:0.85rem; cursor:pointer;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .tool-btn.active{ color:var(--amber); border-color:var(--amber);}
  .gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(130px,1fr));
    gap:12px;
    margin:16px 0;
  }
  .gallery-item{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;
    padding:8px; text-align:center;
    -webkit-tap-highlight-color:transparent;
  }
  .gallery-item img{width:100%; border-radius:8px; background:var(--canvas-bg);}
  .gallery-item .pname{
    margin-top:6px; font-size:0.85rem; color:var(--ink-dim);
  }
  .vote-list{margin:16px 0;}
  .vote-option{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; margin-bottom:8px; cursor:pointer; min-height:48px;
    -webkit-tap-highlight-color:transparent;
  }
  .vote-option:hover{border-color:var(--amber);}
  .vote-option.selected{border-color:var(--amber); background:var(--vote-select-bg);}
  .vote-option .vname{font-weight:700;}
  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .result-row:last-child{border-bottom:none;}
  .tag-wolf{color:var(--red); font-weight:700;}
  .tag-citizen{color:var(--ink-dim);}
  .outcome{
    text-align:center; padding:16px; border-radius:14px; margin:16px 0;
  }
  .outcome.win{background:var(--win-bg); border:1px solid var(--green);}
  .outcome.lose{background:rgba(193,68,60,0.15); border:1px solid var(--red);}
  .outcome h2{margin-bottom:4px;}
  .phase-strip{
    display:flex; gap:4px; margin-bottom:18px;
  }
  .phase-strip .seg{
    flex:1; height:4px; border-radius:99px; background:var(--line);
  }
  .phase-strip .seg.done{background:var(--amber);}
  .phase-strip .seg.now{background:var(--ink);}
  small.foot{display:block; text-align:center; color:var(--ink-dim); margin-top:14px; font-size:0.75rem;}
  .word-hidden{
    filter:blur(0px);
  }
  .tap-hint{
    color:var(--ink-dim); font-size:0.85rem; margin-top:4px;
  }
  /* ---------- プレイヤー固定色のバッジ ---------- */
  .player-color-badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 12px 5px 6px;
    border-radius:99px;
    font-size:0.85rem;
    background:var(--panel2);
    border:1px solid var(--line);
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }
  .player-color-badge.strong{
    background:var(--panel);
    border:1px solid var(--ink-dim);
    font-size:0.95rem;
    padding:6px 14px 6px 6px;
  }
  .pdot{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:22px;
    padding:0 7px;
    border-radius:99px;
    color:#fff;
    font-size:0.75rem;
    font-weight:700;
    letter-spacing:0;
    flex-shrink:0;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6) inset;
  }
  .player-color-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-size:0.85rem;
    color:var(--ink-dim);
    margin:4px 0 10px;
  }
  .pname .pdot, .vname .pdot, .result-name .pdot{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:22px;
    height:22px;
    padding:0 7px;
    border-radius:99px;
    color:#fff;
    font-size:0.72rem;
    font-weight:700;
    margin-right:6px;
    vertical-align:middle;
    box-shadow:0 0 0 1px rgba(255,255,255,0.6) inset;
  }
  .vname{ display:inline-flex; align-items:center; }
</style>
</head>
<body>
<div id="app" aria-live="polite"></div>

<script>
window.addEventListener("error", (e)=>{
  console.error("Sketch Wolf uncaught error:", e.error || e.message);
  try {
    const appEl = document.getElementById("app");
    if(appEl && typeof renderCrash === "function"){
      renderCrash(e.error || new Error(String(e.message)));
    }
  } catch(_){}
});
window.addEventListener("unhandledrejection", (e)=>{
  console.error("Sketch Wolf unhandled rejection:", e.reason);
  try {
    const appEl = document.getElementById("app");
    if(appEl && typeof renderCrash === "function"){
      renderCrash(e.reason instanceof Error ? e.reason : new Error(String(e.reason)));
    }
  } catch(_){}
});

/* ---------- お題ペア ---------- */
const TOPIC_PAIRS = [
  ["ネコ","チーター"],
  ["犬","オオカミ"],
  ["水筒","ペットボトル"],
  ["マグカップ","紙コップ"],
  ["りんご","グリーンアップル"],
  ["ひよこ","アヒル"],
  ["フライパン","中華鍋"],
  ["包丁","ハサミ"],
  ["パソコン","スマホ"],
  ["キーボード（デバイス）","マウス（デバイス）"],
  ["ピアノ","キーボード（楽器）"],
  ["扇風機","エアコン"],
  ["風呂","温泉"],
  ["岩盤浴","サウナ"],
  ["信号機","踏切"],
  ["クッキー","ビスケット"],
  ["ラーメン","うどん"],
  ["テレビ","モニター"],
  ["焼肉","しゃぶしゃぶ"],
  ["なわとび","フラフープ"],
  ["サッカー","野球"]
];

/* ---------- 状態 ---------- */
const PLAYER_NAMES_KEY = "sketchwolf-players";
function defaultPlayerNames(count=3){ return Array.from({length:count}, (_,i)=>`Player${i+1}`); }
function loadSavedNames(){
  try {
    const raw = localStorage.getItem(PLAYER_NAMES_KEY);
    const arr = raw ? JSON.parse(raw) : null;
    if(Array.isArray(arr) && arr.length >= 3){ return arr.slice(0,8).map((v,i)=>String(v||`Player${i+1}`)); }
  } catch(e){}
  return defaultPlayerNames();
}
function saveNames(names){
  try { localStorage.setItem(PLAYER_NAMES_KEY, JSON.stringify(names.map((v,i)=>String(v||`Player${i+1}`).trim()||`Player${i+1}`))); } catch(e){}
}

let state = {
  screen: "setup",
  players: loadSavedNames(),
  wolfCount: 1,
  topic: null,       // {citizen, wolf}
  roles: [],          // per player: "citizen" | "wolf"
  order: [],           // shuffled index order for pass phases
  passIndex: 0,
  drawings: [],        // image URLs per player index
  votes: {},           // playerIndex(voter) -> playerIndex(target)
  voteIndex: 0,
  timer: null,
  timerRemaining: 0,
  timerTotal: 0,
  timerEndAt: null,
  timerOnEnd: null,
  hintTime: 10,
  drawSeconds: 45,
  talkSeconds: 30,
  playerColors: [],    // index -> hex color (fixed per player number)
};

const app = document.getElementById("app");

function revokeDrawingUrl(url){
  if(typeof url === "string" && url.startsWith("blob:")){
    try { URL.revokeObjectURL(url); } catch(e){}
  }
}
function clearDrawingCache(){
  if(Array.isArray(state.drawings)){
    state.drawings.forEach(revokeDrawingUrl);
  }
  state.drawings = [];
}

function render(){
  try {
    clearTimerInterval();
    if(state.screen === "setup") return renderSetup();
    if(state.screen === "intro") return renderIntro();
    if(state.screen === "pass-topic") return renderPassTopic();
    if(state.screen === "talk") return renderTalk();
    if(state.screen === "pass-draw") return renderPassDraw();
    if(state.screen === "gallery") return renderGallery();
    if(state.screen === "vote") return renderVote();
    if(state.screen === "result") return renderResult();
  } catch(err){
    renderCrash(err);
  }
}

function renderCrash(err){
  clearTimerInterval();
  console.error("Sketch Wolf render error:", err);
  app.innerHTML = `
    <div class="card">
      <div class="badge" style="background:var(--red); color:#fff;">エラーが発生しました</div>
      <h2 style="font-size:1.1rem;">画面の表示中に問題が起きました</h2>
      <p style="color:var(--ink-dim); font-size:0.85rem; line-height:1.6;">
        お手数ですが「最初からやり直す」を押してください。繰り返し発生する場合は、下のエラー内容を開発者に共有してください。
      </p>
      <pre style="background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:10px; font-size:0.75rem; color:var(--ink-dim); white-space:pre-wrap; overflow-x:auto; max-height:160px;">${escapeHtml((err && err.stack) || String(err))}</pre>
      <button class="primary" id="crash-restart">最初からやり直す</button>
    </div>
  `;
  const btn = document.getElementById("crash-restart");
  if(btn){
    btn.addEventListener("click", ()=>{
      clearDrawingCache();
      state.screen = "setup";
      render();
    });
  }
}

function card(inner){
  app.innerHTML = `<div class="card">${inner}</div>`;
}

/* ---------- セットアップ ---------- */
function renderSetup(){
  const playersHtml = state.players.map((p,i)=>`
    <div class="player-row">
      <input type="text" placeholder="Player${i+1}" value="${escapeHtml(p || `Player${i+1}`)}" data-idx="${i}" class="pname-input" maxlength="10">
      ${state.players.length>3 ? `<button class="icon-btn" data-remove="${i}">✕</button>` : ""}
    </div>
  `).join("");

  card(`
    <div class="eyebrow">会話 × 絵 で推理するワードウルフ</div>
    <h1>Sketch<span> Wolf</span></h1>
    <div class="sub">同じ画面をパスして遊ぶ、1台端末プレイ版</div>
    <h2>プレイヤー設定</h2>
    <div class="players-list" id="players-list">${playersHtml}</div>
    <button class="add" id="add-player">＋ プレイヤーを追加</button>

    <button class="primary" id="start-btn">ゲームを始める</button>
    <small class="foot">人数は3〜8人。ウルフは1人固定です。端末を順番に回して遊びます。</small>
  `);

  document.querySelectorAll(".pname-input").forEach(inp=>{
    inp.addEventListener("focus", e=>{
      setTimeout(()=>{
        e.target.scrollIntoView({block:"center", behavior:"smooth"});
      }, 300);
    });
    inp.addEventListener("input", e=>{
      state.players[+e.target.dataset.idx] = e.target.value;
      saveNames(state.players);
    });
    inp.addEventListener("blur", e=>{
      const idx = +e.target.dataset.idx;
      const trimmed = e.target.value.trim() || `Player${idx+1}`;
      e.target.value = trimmed;
      state.players[idx] = trimmed;
      saveNames(state.players);
    });
  });
  document.querySelectorAll("[data-remove]").forEach(btn=>{
    btn.addEventListener("click", e=>{
      state.players.splice(+e.target.dataset.remove,1);
      render();
    });
  });
  document.getElementById("add-player").addEventListener("click", ()=>{
    if(state.players.length>=8) return;
    state.players.push("");
    render();
  });
  document.getElementById("start-btn").addEventListener("click", ()=>{
    const names = state.players.map((p,i)=>p.trim() || `Player${i+1}`);
    const filled = names;
    if(filled.length < 3){ alert("3人以上の名前を入力してください(2人には対応していません)"); return; }
    if(filled.length > 8){ alert("プレイヤーは最大8人までです"); return; }
    if(new Set(filled.map(normalizeName)).size !== filled.length){ alert("名前が重複しています"); return; }
    state.players = filled;
    saveNames(filled);
    state.wolfCount = 1;
    setupGame();
  });
}

function setupGame(){
  clearDrawingCache();
  const pair = TOPIC_PAIRS[Math.floor(Math.random()*TOPIC_PAIRS.length)];
  state.topic = { citizen: pair[0], wolf: pair[1] };
  state.hintTime = Math.max(8, Math.round(60/state.players.length));
  state.drawSeconds = 45;
  state.talkSeconds = 30;
  const n = state.players.length;
  // プレイヤー番号 → 固定色を再ゲームでも番号基準で安定的に割り当てる。
  // 名前は localStorage に保存されており、プレイヤーの並び/順番は可変だが
  // 「番号（1〜N）= 色」の対応は 1 から変わらない（端末を誰がパスしても変わらない）。
  state.playerColors = Array.from({length: n}, (_, i)=> playerColor(i));
  const idxs = [...Array(n).keys()];
  shuffle(idxs);
  const wolves = new Set(idxs.slice(0, state.wolfCount));
  state.roles = state.players.map((_,i)=> wolves.has(i) ? "wolf" : "citizen");
  state.order = [...Array(n).keys()];
  state.passIndex = 0;
  state.drawings = new Array(n).fill(null);
  state.votes = {};
  state.voteIndex = 0;
  state.screen = "intro";
  render();
}

  `);

}

/* ---------- お題配布（パス&プレイ） ---------- */
function renderPassTopic(){
  const i = state.order[state.passIndex];
  const name = state.players[i];
  const revealed = state.revealed;

  card(`
    <div class="phase-strip">${phaseSegs("topic")}</div>
    <div class="eyebrow">お題配布 ${state.passIndex+1} / ${state.players.length}</div>
    <div class="pass-screen">
      <div>端末をこの人に渡してください</div>
      <div class="name">${escapeHtml(name)}</div>
      <div class="player-color-row">${colorBadge(i, true)}</div>
      ${!revealed ? `
        <button class="primary" id="reveal-btn" disabled>タップしてお題を見る</button>
        <div class="tap-hint">周りに画面を見られないよう注意してください</div>
      ` : `
        <div class="reveal-box">
          <div class="word" id="word-text">${escapeHtml(state.roles[i]==="wolf"?state.topic.wolf:state.topic.citizen)}</div>
          <div class="hint">これがあなたのお題です。他の人には秘密です</div>
        </div>
        <button class="primary" id="next-pass">確認した。次の人へ</button>
      `}
    </div>
  `);

  if(!revealed){
    const revealBtn = document.getElementById("reveal-btn");
    setTimeout(()=>{ if(revealBtn) revealBtn.disabled = false; }, 500);
    revealBtn.addEventListener("click", ()=>{
      state.revealed = true;
      render();
    });
  } else {
    document.getElementById("next-pass").addEventListener("click", ()=>{
      state.revealed = false;
      state.passIndex++;
      if(state.passIndex >= state.players.length){
        state.passIndex = 0;
        state.screen = "talk";
      }
      render();
    });
  }
}

function phaseSegs(current){
  const phases = ["topic","talk","draw","gallery","vote","result"];
  return phases.map(p=>{
    const idx = phases.indexOf(p), curIdx = phases.indexOf(current);
    let cls = "seg";
    if(idx < curIdx) cls += " done";
    if(idx === curIdx) cls += " now";
    return `<div class="${cls}"></div>`;
  }).join("");
}

/* ---------- お絵描き（パス&プレイ） ---------- */
let canvasCtx = null;
let drawing = false;
let lastX=0,lastY=0;
let smoothX=0,smoothY=0; // 手ブレ補正用（指先の生座標を滑らかに追従させる）
let currentColor = "#3d3929";
let currentSize = 7;
const PEN_COLORS = ["#3d3929","#c1443c","#d97757","#3b6ea5","#4d8c68"];

/* ---------- プレイヤー固定色（番号→色／色名） ----------
 * 公開画面（ギャラリー）と投票画面、投票結果で同じ色を表示し、誰の絵かを一目で識別できるようにする。
 * 端末をパスして遊んでも番号→色の対応は不変。
 */
const PLAYER_COLORS = [
  "#c1443c", // P1: 赤
  "#3b6ea5", // P2: 青
  "#c79100", // P3: 琥珀（＝視認性を高めた濃いめの黄）
  "#3d7556", // P4: 深緑（赤と明度を離して色覚多様性に配慮）
  "#7b5ea7", // P5: 紫
  "#8b5a3c", // P6: 茶
  "#c2538a", // P7: 桃
  "#2a8d8a"  // P8: ターコイズ
];
const PLAYER_COLOR_NAMES = ["赤","青","琥珀","深緑","紫","茶","桃","ターコイズ"];
function playerColor(idx){
  return PLAYER_COLORS[idx % PLAYER_COLORS.length];
}
function playerColorName(idx){
  return PLAYER_COLOR_NAMES[idx % PLAYER_COLOR_NAMES.length];
}
function colorBadge(idx, strong){
  const c = playerColor(idx);
  return `<span class="player-color-badge${strong?' strong':''}" aria-label="プレイヤー${idx+1}の色">
    <span class="pdot" style="background:${c}">${idx+1}</span>
    <span>プレイヤー${idx+1}・${playerColorName(idx)}</span>
  </span>`;
}

function renderPassDraw(){
  const i = state.order[state.passIndex];
  const name = state.players[i];
  const started = state.drawStarted;
  if(!started) currentSize = 7;

  if(!started){
    card(`
      <div class="phase-strip">${phaseSegs("draw")}</div>
      <div class="eyebrow">お絵描きタイム ${state.passIndex+1} / ${state.players.length}</div>
      <div class="pass-screen">
        <div>端末をこの人に渡してください</div>
        <div class="name">${escapeHtml(name)}</div>
        <div class="player-color-row">${colorBadge(i, true)}</div>
        <button class="primary" id="start-draw" disabled>描き始める</button>
      </div>
    `);
    const startDrawBtn = document.getElementById("start-draw");
    setTimeout(()=>{ if(startDrawBtn) startDrawBtn.disabled = false; }, 500);
    startDrawBtn.addEventListener("click", ()=>{
      state.drawStarted = true;
      render();
    });
    return;
  }

  // 描き始めに、そのプレイヤー固有の色を初期ペン色にセットする
  currentColor = playerColor(i);

  card(`
    <div class="phase-strip">${phaseSegs("draw")}</div>
    <div class="eyebrow">${escapeHtml(name)} が描いています</div>
    <div class="center" style="margin-bottom:6px;">
      <div class="player-color-row" style="margin-bottom:8px;">${colorBadge(i, true)}</div>
      ${circleTimerHtml(state.drawSeconds, true)}
    </div>
    <div class="canvas-wrap" id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="zoom-controls">
        <button type="button" class="zoom-btn" id="zoom-in" aria-label="拡大">＋</button>
        <button type="button" class="zoom-btn" id="zoom-reset" aria-label="全体表示に戻す">100%</button>
        <button type="button" class="zoom-btn" id="zoom-out" aria-label="縮小">－</button>
      </div>
    </div>
    <div class="brush-cursor" id="brush-cursor" aria-hidden="true"></div>
    <div class="tools">
      ${PEN_COLORS.map(c=>`<div class="swatch ${c===currentColor?'active':''}" style="background:${c}" data-color="${c}"></div>`).join("")}
      <label class="color-picker-wrap" title="色を選ぶ"><span>色</span><input type="color" id="color-picker" value="${currentColor}"></label>
      <button class="tool-btn" id="toggle-eraser">🖊 消しゴム</button>
      <button class="tool-btn" id="undo-btn">↺ 戻す</button>
      <button class="tool-btn" id="clear-canvas">全部消す</button>
    </div>
    <div class="tools" style="margin-top:-4px;">
      <button class="tool-btn" id="toggle-offset">指ずらし: オフ</button>
    </div>
    <div class="tap-hint" id="pen-size-hint">太さ変更: 右クリック(PC)/素早く2回タップ後ドラッグ(スマホ)。長押しで一時消しゴム。2本指でつまむと拡大縮小＆移動。2本指タップで1つ戻す、3本指タップでやり直し</div>
    <button class="primary" id="done-draw">描き終わった</button>
  `);

  const canvasWrap = document.getElementById("canvas-wrap");
  const canvas = document.getElementById("canvas");
  canvasCtx = canvas.getContext("2d");
  const bgColor = getComputedStyle(document.documentElement).getPropertyValue("--canvas-bg").trim() || "#f2efe9";

  // ---- デバイスの解像度(devicePixelRatio)に合わせてcanvasの実解像度を設定 ----
  // これをしないと、iPhoneなど高解像度端末で線がぼやけて見える
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const wrapRectInit = canvasWrap.getBoundingClientRect();
  const cssW = Math.max(1, Math.round(wrapRectInit.width));
  const cssH = Math.max(1, Math.round(wrapRectInit.height));
  canvas.style.width = cssW + "px";
  canvas.style.height = cssH + "px";
  canvas.width = cssW * dpr;
  canvas.height = cssH * dpr;
  canvasCtx.scale(dpr, dpr);

  // ---- ズーム＆パン（2本指ピンチ／ボタン）----
  // スマホの小さな画面でも細部を描きやすくするため、キャンバスをCSS transformで拡大縮小・移動する。
  // 描画座標は pos() 内で実際の表示サイズ(getBoundingClientRect)から逆算するので、
  // ズーム倍率が変わっても指の位置とペン先がずれない。
  const MIN_ZOOM = 1, MAX_ZOOM = 4;
  let zoomScale = 1, panX = 0, panY = 0;
  function clampNum(v,min,max){ return Math.min(max, Math.max(min, v)); }
  function clampPan(){
    const minX = Math.min(0, cssW - cssW*zoomScale);
    const minY = Math.min(0, cssH - cssH*zoomScale);
    panX = clampNum(panX, minX, 0);
    panY = clampNum(panY, minY, 0);
  }
  function applyTransform(){
    canvas.style.transform = `translate(${panX}px,${panY}px) scale(${zoomScale})`;
    const zr = document.getElementById("zoom-reset");
    if(zr) zr.textContent = `${Math.round(zoomScale*100)}%`;
  }
  function setZoom(newScale, focalClientX, focalClientY){
    newScale = clampNum(newScale, MIN_ZOOM, MAX_ZOOM);
    const wr = canvasWrap.getBoundingClientRect();
    const fx = focalClientX - wr.left, fy = focalClientY - wr.top;
    const localX = (fx - panX) / zoomScale;
    const localY = (fy - panY) / zoomScale;
    zoomScale = newScale;
    panX = fx - localX*zoomScale;
    panY = fy - localY*zoomScale;
    clampPan();
    applyTransform();
  }
  applyTransform();

  // ---- 元に戻す／やり直し（取り消し履歴）----
  const historyStack = [];
  const redoStack = [];
  const HISTORY_LIMIT = 20;
  function pushHistory(){
    try{
      historyStack.push(canvasCtx.getImageData(0,0,canvas.width,canvas.height));
      if(historyStack.length > HISTORY_LIMIT) historyStack.shift();
      redoStack.length = 0;
    }catch(e){ /* ignore */ }
  }
  function undo(){
    if(historyStack.length === 0) return;
    try{
      redoStack.push(canvasCtx.getImageData(0,0,canvas.width,canvas.height));
      canvasCtx.putImageData(historyStack.pop(), 0, 0);
    }catch(e){}
  }
  function redo(){
    if(redoStack.length === 0) return;
    try{
      historyStack.push(canvasCtx.getImageData(0,0,canvas.width,canvas.height));
      canvasCtx.putImageData(redoStack.pop(), 0, 0);
    }catch(e){}
  }

  // 2本指ピンチでのズーム＆パン／2本指タップで戻す／3本指タップでやり直し
  const touchPts = new Map();
  const touchStartPts = new Map();
  let pinch = null;
  let gestureFingers = 0;
  let gestureStartTime = 0;
  let gestureBroken = false;
  const TAP_MOVE_TOLERANCE = 18;
  const TAP_MAX_DURATION = 400;
  function touchDist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function touchMid(a,b){ return [(a.x+b.x)/2, (a.y+b.y)/2]; }
  function abortDrawingForPinch(){
    if(drawing){
      drawing = false; points = []; moved = false;
      if(activePointerId !== null){
        try{ canvas.releasePointerCapture(activePointerId); }catch(e){}
      }
      activePointerId = null;
      hideBrushCursor();
    }
    resizingPen = false;
  }
  canvasWrap.addEventListener("pointerdown", e=>{
    if(e.pointerType !== "touch") return;
    touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    touchStartPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(touchPts.size === 1){
      gestureStartTime = Date.now();
      gestureBroken = false;
      gestureFingers = 1;
    } else {
      gestureFingers = Math.max(gestureFingers, touchPts.size);
    }
    if(touchPts.size === 2){
      abortDrawingForPinch();
      const [a,b] = [...touchPts.values()];
      pinch = { startDist: touchDist(a,b), startMid: touchMid(a,b), startScale: zoomScale, startPanX: panX, startPanY: panY };
    } else if(touchPts.size >= 3){
      abortDrawingForPinch();
      pinch = null; // 3本指以降はズームせず、指を離した時にタップ判定(やり直し)だけ見る
    }
  });
  canvasWrap.addEventListener("pointermove", e=>{
    if(e.pointerType !== "touch" || !touchPts.has(e.pointerId)) return;
    touchPts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    const st = touchStartPts.get(e.pointerId);
    if(st && Math.hypot(e.clientX-st.x, e.clientY-st.y) > TAP_MOVE_TOLERANCE) gestureBroken = true;
    if(pinch && touchPts.size === 2){
      e.preventDefault();
      const [a,b] = [...touchPts.values()];
      const dist = touchDist(a,b);
      const mid = touchMid(a,b);
      const wr = canvasWrap.getBoundingClientRect();
      const newScale = clampNum(pinch.startScale * (dist / Math.max(1,pinch.startDist)), MIN_ZOOM, MAX_ZOOM);
      const fx0 = pinch.startMid[0]-wr.left, fy0 = pinch.startMid[1]-wr.top;
      const localX = (fx0 - pinch.startPanX)/pinch.startScale;
      const localY = (fy0 - pinch.startPanY)/pinch.startScale;
      panX = (mid[0]-wr.left) - localX*newScale;
      panY = (mid[1]-wr.top) - localY*newScale;
      zoomScale = newScale;
      clampPan();
      applyTransform();
    }
  });
  function releaseTouchPoint(e){
    if(e.pointerType !== "touch") return;
    touchPts.delete(e.pointerId);
    touchStartPts.delete(e.pointerId);
    if(touchPts.size < 2) pinch = null;
    if(touchPts.size === 0){
      const duration = Date.now() - gestureStartTime;
      if(!gestureBroken && duration < TAP_MAX_DURATION){
        if(gestureFingers === 2) undo();
        else if(gestureFingers >= 3) redo();
      }
      gestureFingers = 0;
    }
  }
  canvasWrap.addEventListener("pointerup", releaseTouchPoint);
  canvasWrap.addEventListener("pointercancel", releaseTouchPoint);
  canvasWrap.addEventListener("pointerleave", releaseTouchPoint);

  canvasCtx.fillStyle = bgColor;
  canvasCtx.fillRect(0,0,cssW,cssH);
  canvasCtx.lineJoin = "round";
  canvasCtx.lineCap = "round";
  if("imageSmoothingEnabled" in canvasCtx) canvasCtx.imageSmoothingEnabled = true;
  canvas.addEventListener("contextmenu", e=> e.preventDefault());

  const MIN_SIZE = 2, MAX_SIZE = 24;
  const LONG_PRESS_MS = 450;
  const LONG_PRESS_MOVE_TOLERANCE = 6; // CSSピクセル。これ以上動いたら長押し消しゴムは発動しない
  let resizingPen = false;
  let resizeStartX = 0;
  let resizeStartSize = currentSize;
  let lastTouchEnd = { time:0, x:0, y:0 };
  let activePointerId = null; // パームリジェクション:描画開始した指(ポインター)のみ受け付ける
  let strokeColor = currentColor;
  let strokeStartTime = 0;
  let strokeStartPos = [0,0];
  let longPressTimer = null;
  let erasing = false;
  let eraserMode = false; // ワンタップで固定するペン/消しゴム切り替え(長押し一時消しゴムとは別)
  let fingerOffsetEnabled = false; // 指の少し上に描画位置をずらして、指で線が隠れるのを防ぐ
  const FINGER_OFFSET_PX = 46;
  let lastMoveTime = 0;
  let moved = false; // pointerdown後に一度でも動いたか(動いていなければ最後にドットを描く)

  let points = [];
  const brushCursor = document.getElementById("brush-cursor");
  function updateBrushCursor(x,y,visible=true){
    if(!brushCursor) return;
    const diameter = Math.max(12, currentSize*2);
    brushCursor.style.width = `${diameter}px`; brushCursor.style.height = `${diameter}px`;
    brushCursor.style.left = `${x}px`; brushCursor.style.top = `${y}px`;
    brushCursor.style.display = visible ? "block" : "none";
    brushCursor.style.borderColor = erasing ? "var(--red)" : "#fff";
  }
  function hideBrushCursor(){ if(brushCursor) brushCursor.style.display="none"; }

  function pos(e){
    const r = canvas.getBoundingClientRect();
    // ctx.scale(dpr,dpr) 済みなので、CSSピクセル座標をそのまま描画座標として使う。
    // ズーム中はcanvasの表示サイズ(r.width)がcssWより大きくなるので、その比率で逆算して
    // 実際のペン先とタッチ位置がずれないようにする。
    const displayScale = r.width / cssW || 1;
    let cx = e.clientX, cy = e.clientY;
    if(fingerOffsetEnabled && e.pointerType === "touch" && !erasing){
      cy -= FINGER_OFFSET_PX; // 画面上での見た目のズレ量は一定にしたいので、キャンバス座標に直す前に引く
    }
    return [(cx-r.left)/displayScale, (cy-r.top)/displayScale];
  }
  function cursorScreenPos(e){
    // ブラシカーソル(丸)の表示位置。指ずらしONの時は実際の描画位置と同じ場所に表示する。
    let x = e.clientX, y = e.clientY;
    if(fingerOffsetEnabled && e.pointerType === "touch" && !erasing){
      y -= FINGER_OFFSET_PX;
    }
    return [x,y];
  }
  function drawDot(x,y,size,color){
    // 描き始めの最初の点が抜けて見える現象を防ぐため、開始位置に丸を1つ描いておく
    canvasCtx.beginPath();
    canvasCtx.fillStyle = color;
    canvasCtx.arc(x, y, size/2, 0, Math.PI*2);
    canvasCtx.fill();
  }
  function startResize(clientXPos){
    resizingPen = true;
    resizeStartX = clientXPos;
    resizeStartSize = currentSize;
  }
  function updateResize(clientXPos){
    const delta = clientXPos - resizeStartX;
    currentSize = Math.round(Math.min(MAX_SIZE, Math.max(MIN_SIZE, resizeStartSize + delta/6)));
    updateBrushCursor(lastX,lastY,true);
  }
  function triggerErase(){
    erasing = true;
    strokeColor = bgColor;
    currentSize = Math.min(MAX_SIZE, currentSize) * 1; // サイズはそのまま、色だけ背景色に
    updateBrushCursor(lastX + canvas.getBoundingClientRect().left, lastY + canvas.getBoundingClientRect().top, true);
  }
  function start(e){
    // パームリジェクション: すでに描画中/リサイズ中のポインターがあれば、他の指(手のひら等)は無視する
    if(activePointerId !== null && e.pointerId !== activePointerId) return;
    e.preventDefault();
    if(e.button === 2){
      activePointerId = e.pointerId;
      startResize(e.clientX);
      return;
    }
    const now = Date.now();
    if(e.pointerType === "touch"){
      const isDoubleTap = (now - lastTouchEnd.time < 300) &&
        Math.abs(e.clientX - lastTouchEnd.x) < 40 && Math.abs(e.clientY - lastTouchEnd.y) < 40;
      if(isDoubleTap){
        activePointerId = e.pointerId;
        startResize(e.clientX);
        return;
      }
    }
    activePointerId = e.pointerId;
    canvas.setPointerCapture(e.pointerId);
    drawing=true;
    pushHistory();
    erasing = eraserMode;
    moved=false;
    strokeColor = eraserMode ? bgColor : currentColor;
    lastMoveTime = performance.now ? performance.now() : now;
    [lastX,lastY]=pos(e);
    smoothX = lastX; smoothY = lastY;
    strokeStartPos = [lastX,lastY];
    strokeStartTime = now;
    const [bcx,bcy]=cursorScreenPos(e); updateBrushCursor(bcx,bcy,true);
    points=[[lastX,lastY]];
    canvasCtx.strokeStyle = strokeColor;
    canvasCtx.lineWidth = currentSize;
    // ここではまだ何も描かない(タップだけなら pointerup 時にドットを描く。動けば move() で線を描く)

    // 長押し(指を動かさず一定時間そのまま)で一時的に消しゴムへ切り替え
    if(e.pointerType === "touch"){
      clearTimeout(longPressTimer);
      longPressTimer = setTimeout(()=>{
        if(!drawing) return;
        const dist = Math.hypot(lastX-strokeStartPos[0], lastY-strokeStartPos[1]);
        if(dist < LONG_PRESS_MOVE_TOLERANCE){
          triggerErase();
        }
      }, LONG_PRESS_MS);
    }
  }
  function move(e){
    if(activePointerId !== null && e.pointerId !== activePointerId) return;
    if(resizingPen){
      e.preventDefault();
      updateResize(e.clientX);
      return;
    }
    if(!drawing) return;
    e.preventDefault();
    const [rawX,rawY]=pos(e);
    // 強力な手ブレ補正: 生の指の座標を指数移動平均で滑らかに追従させ、細かな震えを吸収する。
    // 補正レベル7/10相当(1=ほぼ補正なし・追従が速い 〜 10=最大限に滑らか・追従が遅い)。
    // レベルが上がるほどSMOOTHINGの値を小さくして、生座標への追従を遅くする=震えが線に出にくくなる。
    const SMOOTHING = e.pointerType === "touch" ? 0.10 : 0.30;
    smoothX += (rawX - smoothX) * SMOOTHING;
    smoothY += (rawY - smoothY) * SMOOTHING;
    const [x,y] = erasing ? [rawX,rawY] : [smoothX,smoothY]; // 消しゴムは即応性を優先して生座標を使う
    const now = performance.now ? performance.now() : Date.now();

    // 描画速度に応じて線の太さをわずかに変える(±25%程度): 速いほど細く、遅いほど太く
    const dt = Math.max(1, now - (lastMoveTime || now));
    const dist = Math.hypot(x-lastX, y-lastY);
    const speed = dist / dt; // px/ms
    const speedFactor = Math.max(0.75, Math.min(1.25, 1.15 - speed*0.9));
    lastMoveTime = now;

    const [bcx,bcy]=cursorScreenPos(e); updateBrushCursor(bcx,bcy,true);
    points.push([x,y]);
    moved = true;
    // 入り(フェードイン)【強制入り抜き: 常時ON・最大】: 描き始めをほぼ0の太さから始め、
    // 長い距離をかけて徐々に本来の太さまで立ち上げることで、確実に鋭い入りを作る
    const fadeIn = erasing ? 1 : Math.min(1, Math.pow(points.length/18, 1.4));
    const w = erasing ? currentSize*3 : Math.max(0.4, currentSize*speedFactor*fadeIn);
    canvasCtx.strokeStyle = strokeColor;
    canvasCtx.lineWidth = w;
    if(points.length < 3){
      canvasCtx.beginPath();
      canvasCtx.moveTo(lastX,lastY);
      canvasCtx.lineTo(x,y);
      canvasCtx.stroke();
    } else {
      const n = points.length;
      const [x0,y0] = points[n-3];
      const [x1,y1] = points[n-2];
      const midPrev = [(x0+x1)/2, (y0+y1)/2];
      const midCurr = [(x1+x)/2, (y1+y)/2];
      canvasCtx.beginPath();
      canvasCtx.moveTo(midPrev[0], midPrev[1]);
      canvasCtx.quadraticCurveTo(x1, y1, midCurr[0], midCurr[1]);
      canvasCtx.stroke();
    }
    [lastX,lastY]=[x,y];

    // 動いたら長押し消しゴムの発動条件から外れる(タイマー内で距離チェックしているのでここでは何もしない)
  }
  function end(e){
    if(e && activePointerId !== null && e.pointerId !== activePointerId) return;
    clearTimeout(longPressTimer);
    if(e && e.pointerType === "touch"){
      lastTouchEnd = { time: Date.now(), x: e.clientX, y: e.clientY };
    }
    // タップ(一度も動かなかった)の場合だけ、ここでドットを描く
    if(drawing && !moved){
      canvasCtx.strokeStyle = strokeColor;
      drawDot(lastX,lastY, erasing ? currentSize*3 : currentSize, strokeColor);
    }
    // ストローク終端(抜き): 最後の方向へ、線幅を徐々に細くしながら数ステップに分けて延長し、
    // ペンで描いたような自然な「抜き」の先端を再現する
    if(drawing && points.length >= 2 && !erasing){
      const n = points.length;
      const [px,py] = points[n-2];
      const [cx,cy] = points[n-1];
      const dx = cx-px, dy = cy-py;
      const len = Math.hypot(dx,dy);
      if(len > 0.001){
        // 強制入り抜き【常時ON・最大(長さ100%相当)】: サイズに対する伸び幅と分割数を最大化し、
        // どんな線でも確実にシュッと鋭い払いになるようにする
        const ux = dx/len, uy = dy/len;
        const totalExt = Math.min(28, currentSize*3.2);
        const steps = 10;
        let fromX = cx, fromY = cy;
        canvasCtx.strokeStyle = strokeColor;
        for(let s=1; s<=steps; s++){
          const t = s/steps;
          const toX = cx + ux*totalExt*t;
          const toY = cy + uy*totalExt*t;
          canvasCtx.lineWidth = Math.max(0.3, currentSize*(1-Math.pow(t,0.8)));
          canvasCtx.beginPath();
          canvasCtx.moveTo(fromX,fromY);
          canvasCtx.lineTo(toX,toY);
          canvasCtx.stroke();
          fromX = toX; fromY = toY;
        }
      }
    } else if(drawing && points.length >= 2 && erasing){
      const n = points.length;
      const [px,py] = points[n-2];
      const [cx,cy] = points[n-1];
      const dx = cx-px, dy = cy-py;
      const len = Math.hypot(dx,dy);
      if(len > 0.001){
        const ext = Math.min(4, currentSize*0.4);
        const ex = cx + (dx/len)*ext;
        const ey = cy + (dy/len)*ext;
        canvasCtx.strokeStyle = strokeColor;
        canvasCtx.lineWidth = currentSize*3;
        canvasCtx.beginPath();
        canvasCtx.moveTo(cx,cy);
        canvasCtx.lineTo(ex,ey);
        canvasCtx.stroke();
      }
    }
    drawing=false; points=[]; resizingPen=false; activePointerId = null; erasing=false;
    hideBrushCursor();
  }

  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerenter", e=>{
    if(e.pointerType !== "touch") updateBrushCursor(e.clientX,e.clientY,true);
  });
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointercancel", end);
  canvas.addEventListener("pointerleave", e=>{
    if(e.pointerType !== "touch") hideBrushCursor();
  });

  function refreshToolButtons(){
    document.querySelectorAll(".swatch").forEach(sw=>{
      sw.classList.toggle("active", sw.dataset.color === currentColor);
    });
  }

  document.querySelectorAll(".swatch").forEach(sw=>{
    sw.addEventListener("click", ()=>{
      currentColor = sw.dataset.color;
      refreshToolButtons();
    });
  });
  document.getElementById("color-picker").addEventListener("input", e=>{
    currentColor = e.target.value;
    refreshToolButtons();
  });

  document.getElementById("clear-canvas").addEventListener("click", ()=>{
    pushHistory();
    canvasCtx.fillStyle = bgColor;
    canvasCtx.fillRect(0,0,cssW,cssH);
  });

  // ワンタップでペン⇔消しゴムを切り替え(クイックチェンジャー)
  const eraserBtn = document.getElementById("toggle-eraser");
  eraserBtn.addEventListener("click", ()=>{
    eraserMode = !eraserMode;
    eraserBtn.textContent = eraserMode ? "🖊 ペンに戻す" : "🖊 消しゴム";
    eraserBtn.classList.toggle("active", eraserMode);
  });

  // 戻す(取り消し)ボタン。2本指タップでも同じ操作ができる
  document.getElementById("undo-btn").addEventListener("click", ()=> undo());

  // 指ずらし(先端補正): 描画位置を指の少し上にずらして、指で線が隠れるのを防ぐ
  const offsetBtn = document.getElementById("toggle-offset");
  offsetBtn.addEventListener("click", ()=>{
    fingerOffsetEnabled = !fingerOffsetEnabled;
    offsetBtn.textContent = fingerOffsetEnabled ? "指ずらし: オン" : "指ずらし: オフ";
    offsetBtn.classList.toggle("active", fingerOffsetEnabled);
  });

  // ズームボタン（ピンチが苦手な人やマウス操作向けの補助UI）
  const ZOOM_STEP = 0.5;
  document.getElementById("zoom-in").addEventListener("click", ()=>{
    const wr = canvasWrap.getBoundingClientRect();
    setZoom(zoomScale + ZOOM_STEP, wr.left + wr.width/2, wr.top + wr.height/2);
  });
  document.getElementById("zoom-out").addEventListener("click", ()=>{
    const wr = canvasWrap.getBoundingClientRect();
    setZoom(zoomScale - ZOOM_STEP, wr.left + wr.width/2, wr.top + wr.height/2);
  });
  document.getElementById("zoom-reset").addEventListener("click", ()=>{
    zoomScale = 1; panX = 0; panY = 0;
    applyTransform();
  });

  let finished = false;
  async function finishDrawing(){
    if(finished) return;
    finished = true;
    clearTimerInterval();

    const blob = await new Promise(resolve => {
      try {
        canvas.toBlob(resolve, "image/webp", 0.82);
      } catch(e){
        resolve(null);
      }
    });

    revokeDrawingUrl(state.drawings[i]);
    state.drawings[i] = blob
      ? URL.createObjectURL(blob)
      : canvas.toDataURL("image/png");

    state.drawStarted = false;
    state.passIndex++;
    if(state.passIndex >= state.players.length){
      state.passIndex = 0;
      state.screen = "gallery";
    }
    render();
  }

  document.getElementById("done-draw").addEventListener("click", ()=>{
    finishDrawing();
  });

  startTimer(state.drawSeconds, finishDrawing);
}

/* ---------- 絵の公開 ---------- */
function renderGallery(){
  const items = state.players.map((name,i)=>`
    <div class="gallery-item" data-zoom="${i}" style="cursor:pointer;">
      <img src="${state.drawings[i]}" alt="${escapeHtml(name)}の絵" loading="lazy" decoding="async" draggable="false">
      <div class="pname"><span class="pdot" style="background:${playerColor(i)}">${i+1}</span>${escapeHtml(name)}</div>
    </div>
  `).join("");
  card(`
    <div class="phase-strip">${phaseSegs("gallery")}</div>
    <div class="eyebrow">絵を公開</div>
    <h2>全員の絵を見比べて、会話と食い違う人を探しましょう</h2>
    <div class="tap-hint" style="margin-bottom:10px;">画力ではなく、お題との一致を推理するゲームです。タップで拡大できます</div>
    <div class="gallery">${items}</div>
    <button class="primary" id="to-vote">投票へ</button>
  `);
  document.querySelectorAll("[data-zoom]").forEach(el=>{
    el.addEventListener("click", ()=>{
      const i = +el.dataset.zoom;
      showZoom(state.drawings[i], state.players[i], playerColor(i));
    });
  });
  document.getElementById("to-vote").addEventListener("click", ()=>{
    state.screen = "vote"; render();
  });
}

function showZoom(src, name, color){
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.75); display:flex; align-items:center; justify-content:center; z-index:999; padding:24px;";
  overlay.innerHTML = `
    <div style="max-width:420px; width:100%; text-align:center;">
      <img src="${src}" decoding="async" draggable="false" style="width:100%; border-radius:14px; box-shadow:0 20px 50px rgba(0,0,0,0.5);">
      <div style="color:var(--overlay-text); font-family:'Yomogi','Hiragino Sans',sans-serif,cursive; font-size:1.4rem; margin-top:12px; display:inline-flex; align-items:center; gap:10px; justify-content:center;">
        <span class="pdot" style="background:${color}"> </span>${escapeHtml(name)}
      </div>
      <div style="color:var(--overlay-text-dim); font-size:0.85rem; margin-top:4px;">タップして閉じる</div>
    </div>
  `;
  overlay.addEventListener("click", ()=> overlay.remove());
  document.body.appendChild(overlay);
}

/* ---------- 投票（パス&プレイ） ---------- */
function renderVote(){
  const voter = state.voteIndex;
  const voterName = state.players[voter];
  let selected = state.votes[voter];

  const options = state.players.map((name,i)=>{
    if(i===voter) return "";
    return `<div class="vote-option ${selected===i?'selected':''}" data-target="${i}">
      <span class="vname"><span class="pdot" style="background:${playerColor(i)}">${i+1}</span>${escapeHtml(name)}</span>
      <span>${selected===i?"✓":""}</span>
    </div>`;
  }).join("");

  card(`
    <div class="phase-strip">${phaseSegs("vote")}</div>
    <div class="eyebrow">投票 ${voter+1} / ${state.players.length}</div>
    <div class="pass-screen" style="padding-top:0;">
      <div>端末をこの人に渡してください</div>
      <div class="name">${escapeHtml(voterName)}</div>
      <div class="player-color-row">${colorBadge(voter, true)}</div>
    </div>
    <h2 style="font-size:1.1rem;">ウルフだと思う人を選んでください</h2>
    <div class="vote-list">${options}</div>
    <button class="primary" id="confirm-vote" ${selected===undefined?"disabled":""}>投票を確定する</button>
  `);

  document.querySelectorAll(".vote-option").forEach(el=>{
    el.addEventListener("click", ()=>{
      state.votes[voter] = +el.dataset.target;
      render();
    });
  });
  document.getElementById("confirm-vote").addEventListener("click", ()=>{
    state.voteIndex++;
    if(state.voteIndex >= state.players.length){
      state.screen = "result";
    }
    render();
  });
}

/* ---------- 結果 ---------- */
function renderResult(){
  const tally = new Array(state.players.length).fill(0);
  Object.values(state.votes).forEach(t=> tally[t]++);
  const maxVotes = Math.max(...tally);
  const topVoted = tally.map((v,i)=>v===maxVotes?i:-1).filter(i=>i>=0);

  const wolfIdxs = state.roles.map((r,i)=>r==="wolf"?i:-1).filter(i=>i>=0);
  const caughtAllWolves = wolfIdxs.length>0 && wolfIdxs.every(w=>topVoted.includes(w)) && topVoted.length===wolfIdxs.length;
  const citizensWin = caughtAllWolves;
  const isTie = topVoted.length > 1;

  let tieNote = "";
  if(isTie){
    const tieNames = topVoted.map(i=>state.players[i]).join("・");
    if(citizensWin){
      tieNote = `最多票が${tieNames}で同着でしたが、ウルフ全員がちょうどその中に含まれていたため市民の勝ちです。`;
    } else {
      tieNote = `最多票が${tieNames}で同着になり、ウルフを1人に絞りきれなかった(または市民を巻き込んだ)ためウルフの勝ちです。`;
    }
  }

  const maxTally = Math.max(1, ...tally);
  const rows = state.players.map((name,i)=>`
    <div class="result-row" style="flex-direction:column; align-items:stretch; gap:6px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span class="result-name" style="display:inline-flex; align-items:center;"><span class="pdot" style="background:${playerColor(i)}">${i+1}</span>${escapeHtml(name)} <span style="color:var(--ink-dim); font-size:0.85rem; margin-left:6px;">(${tally[i]}票)</span></span>
        <span class="${state.roles[i]==='wolf'?'tag-wolf':'tag-citizen'}">${state.roles[i]==='wolf'?'ウルフ':'市民'}</span>
      </div>
      <div class="timer-bar-track">
        <div class="vote-bar-fill" data-final="${(tally[i]/maxTally)*100}" style="height:100%; width:0%; border-radius:99px; background:${playerColor(i)}; transition:width 0.9s cubic-bezier(.2,.8,.3,1);"></div>
      </div>
    </div>
  `).join("");

  card(`
    <div class="phase-strip">${phaseSegs("result")}</div>
    <div class="eyebrow">結果発表</div>
    <div class="outcome ${citizensWin?'win':'lose'}">
      <h2>${citizensWin ? "市民の勝ち!" : "ウルフの勝ち!"}</h2>
      <div style="color:var(--ink-dim); font-size:0.9rem;">
        市民のお題「${escapeHtml(state.topic.citizen)}」 / ウルフのお題「${escapeHtml(state.topic.wolf)}」
      </div>
    </div>
    ${isTie ? `<div class="tap-hint" style="margin-bottom:14px;">${escapeHtml(tieNote)}</div>` : ""}
    <h2 style="font-size:1.05rem;">投票結果と正体</h2>
    <div>${rows}</div>
    <button class="primary" id="replay">同じメンバーでもう一度</button>
    <button class="ghost" id="restart">最初から設定し直す</button>
  `);

  document.getElementById("replay").addEventListener("click", ()=>{
    setupGame();
  });
  document.getElementById("restart").addEventListener("click", ()=>{
    clearDrawingCache();
    state.screen = "setup";
    state.votes = {};
    render();
  });

  requestAnimationFrame(()=>{
    setTimeout(()=>{
      document.querySelectorAll(".vote-bar-fill").forEach(el=>{
        el.style.width = el.dataset.final + "%";
      });
    }, 80);
  });
}

/* ---------- タイマー共通 ---------- */
const TIMER_R = 80;
const TIMER_CIRC = 2 * Math.PI * TIMER_R;
function circleTimerHtml(seconds, compact){
  return `
    <div class="circle-timer${compact?' compact':''}" id="circle-timer">
      <svg viewBox="0 0 180 180">
        <circle class="ctrack" cx="90" cy="90" r="${TIMER_R}"></circle>
        <circle class="cprogress" id="timer-circle" cx="90" cy="90" r="${TIMER_R}"
          stroke-dasharray="${TIMER_CIRC}" stroke-dashoffset="0"></circle>
      </svg>
      <div class="ctext" id="timer-display" aria-live="polite">00:${String(seconds).padStart(2,"0")}</div>
    </div>
  `;
}
let wakeLock = null;
async function requestWakeLock(){
  try {
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch(e){ /* wake lock not available, ignore */ }
}
function releaseWakeLock(){
  if(wakeLock){
    try { wakeLock.release(); } catch(e){}
    wakeLock = null;
  }
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && state.timer && !wakeLock){
    requestWakeLock();
  }
});

function startTimer(seconds, onEnd){
  clearTimerInterval();
  requestWakeLock();
  state.timerTotal = seconds;
  state.timerEndAt = Date.now() + seconds*1000;
  state.timerRemaining = seconds;
  state.timerOnEnd = onEnd;
  updateTimerDisplay();
  state.timer = setInterval(tick, 250);
  function tick(){
    const remainingMs = state.timerEndAt - Date.now();
    state.timerRemaining = Math.max(0, Math.ceil(remainingMs/1000));
    if(remainingMs <= 0){
      clearTimerInterval();
      state.timerRemaining = 0;
      updateTimerDisplay();
      const cb = state.timerOnEnd;
      state.timerOnEnd = null;
      if(cb) cb();
      return;
    }
    updateTimerDisplay();
  }
}
function updateTimerDisplay(){
  const el = document.getElementById("timer-display");
  const bar = document.getElementById("timer-bar");
  const circle = document.getElementById("timer-circle");
  const wrap = document.getElementById("circle-timer");
  if(el){
    const m = Math.floor(state.timerRemaining/60).toString().padStart(2,"0");
    const s = (state.timerRemaining%60).toString().padStart(2,"0");
    el.textContent = `${m}:${s}`;
  }
  if(bar){
    bar.style.width = `${(state.timerRemaining/state.timerTotal)*100}%`;
  }
  if(circle){
    const ratio = Math.max(0, state.timerRemaining/state.timerTotal);
    circle.style.strokeDashoffset = `${TIMER_CIRC * (1-ratio)}`;
  }
  if(wrap){
    if(state.timerRemaining <= 5 && state.timerRemaining > 0){
      wrap.classList.add("urgent");
    } else {
      wrap.classList.remove("urgent");
    }
  }
}
function clearTimerInterval(){
  if(state.timer){ clearInterval(state.timer); state.timer=null; }
  releaseWakeLock();
}
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && state.timer && state.timerEndAt){
    const remainingMs = state.timerEndAt - Date.now();
    state.timerRemaining = Math.max(0, Math.ceil(remainingMs/1000));
    if(remainingMs <= 0){
      clearTimerInterval();
      state.timerRemaining = 0;
      updateTimerDisplay();
      const cb = state.timerOnEnd;
      state.timerOnEnd = null;
      if(cb) cb();
    } else {
      updateTimerDisplay();
    }
  }
});

/* ---------- ユーティリティ ---------- */
function filledCount(players){
  return players.map(p=>p.trim()).filter(n=>n.length>0).length;
}
function normalizeName(n){
  const base = String(n).normalize("NFKC").trim();
  const stripped = base
    // 異体字セレクタ・ゼロ幅文字を除去(見た目が同じでも別コードポイントで重複判定を逃れるのを防ぐ)
    .replace(/[\uFE00-\uFE0F\u200B-\u200D\uFEFF]/g, "")
    // 絵文字・記号(Emoji, Symbol, Pictographなど)を除去して文字情報だけで比較する
    .replace(/\p{Extended_Pictographic}/gu, "")
    .replace(/\s+/g, " ")
    .trim()
    .toLowerCase();
  // 絵文字のみの名前など、除去後に空になる場合は元の文字列で比較する(異なる絵文字名を誤って同一扱いしないため)
  return stripped.length > 0 ? stripped : base.toLowerCase();
}
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

render();
